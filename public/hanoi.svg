<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pegGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cbd5e1"/>
      <stop offset="50%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8a29e"/>
      <stop offset="100%" style="stop-color:#78716c"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect x="10" y="85" width="80" height="10" rx="2" fill="url(#baseGradient)"/>

  <!-- Peg -->
  <rect x="46" y="20" width="8" height="65" rx="2" fill="url(#pegGradient)"/>

  <!-- Disks -->
  <rect x="30" y="75" width="40" height="8" rx="2" fill="#ef4444"/>
  <rect x="25" y="65" width="50" height="8" rx="2" fill="#eab308"/>
  <rect x="20" y="55" width="60" height="8" rx="2" fill="#22c55e"/>
</svg>